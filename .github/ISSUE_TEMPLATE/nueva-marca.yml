name: Nueva marca
description: Propón una marca española emergente. La investigamos automáticamente y abrimos una PR.
title: "[Marca] "
labels: ["nueva-marca"]
body:
  - type: markdown
    attributes:
      value: |
        Solo necesitamos el nombre y la web. Un bot investigará la marca (qué hace, de dónde es, precios) y abrirá una propuesta que revisaremos antes de publicarla. 🇪🇸
  - type: input
    id: nombre
    attributes:
      label: Nombre de la marca
    validations:
      required: true
  - type: input
    id: web
    attributes:
      label: Web o tienda online
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: motivo
    attributes:
      label: ¿Por qué la recomiendas? (opcional)
      description: Cualquier dato útil, por ejemplo qué regalarías o de dónde son.
  - type: checkboxes
    id: propia
    attributes:
      label: Transparencia
      options:
        - label: Es mi propia marca o trabajo en ella
